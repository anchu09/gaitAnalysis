[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gait-analysis"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["gait_analysis"]

[tool.ruff]
line-length = 100
src = ["."]
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
